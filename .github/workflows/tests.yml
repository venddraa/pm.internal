name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure environment
        run: |
          cp .env.example .env
          echo "LOCAL_UID=$(id -u)" >> .env
          echo "LOCAL_GID=$(id -g)" >> .env

      - name: Build development image
        run: docker compose build app

      - name: Install locked dependencies
        run: |
          docker compose run --rm --no-deps app composer install --no-interaction --prefer-dist
          docker compose run --rm --no-deps app npm ci
          docker compose run --rm --no-deps app php artisan key:generate

      - name: Check frontend
        run: |
          docker compose run --rm --no-deps app php artisan wayfinder:generate --with-form
          docker compose run --rm --no-deps app npm run check
          docker compose run --rm --no-deps app npm run types:check
          docker compose run --rm --no-deps app npm run build

      - name: Check backend
        run: docker compose run --rm -e DB_DATABASE=saya_akan_monitor_test app composer test

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop CI containers
        if: always()
        run: docker compose down -v
